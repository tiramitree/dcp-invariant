name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality / ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install development tools
        run: python -m pip install -e ".[dev]"
      - name: Static checks
        run: |
          python -m ruff check src tests scripts
          python -m ruff format --check src tests scripts
      - name: PyTorch-free tests
        run: >-
          python -m pytest
          --ignore=tests/test_state.py
          --ignore=tests/test_worker_helpers.py

  integration:
    name: integration / ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install project and pinned CPU runtime
        run: |
          python -m pip install -e ".[dev,runtime]"
          python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Run unit and live ten-scenario suite
        run: python -m pytest
        env:
          DCP_INVARIANT_LIVE: "1"

  package:
    name: package boundary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Scan clean source tree
        run: python scripts/privacy_scan.py .
      - name: Build distributions
        run: |
          python -m pip install -e ".[dev]"
          python -m build
      - name: Verify source-only distribution boundary
        run: python scripts/verify_distribution.py dist
      - name: Install and smoke-test the wheel outside the source tree
        run: |
          python -m venv "$RUNNER_TEMP/dcp-wheel-smoke"
          "$RUNNER_TEMP/dcp-wheel-smoke/bin/python" -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          PYTHONNOUSERSITE=1 "$RUNNER_TEMP/dcp-wheel-smoke/bin/python" -c "import dcp_invariant; assert dcp_invariant.__version__ == '0.1.0'"
          PYTHONNOUSERSITE=1 "$RUNNER_TEMP/dcp-wheel-smoke/bin/dcp-invariant" --help
