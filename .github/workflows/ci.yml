name: ci

on:
  push:
    branches: [main, elastic-restart-v0.2, async-snapshot-v0.3, feature/generation-lineage-v04]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality / ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install development tools
        run: python -m pip install -e ".[dev]"
      - name: Static checks
        run: |
          python -m ruff check src tests scripts
          python -m ruff format --check src tests scripts
      - name: PyTorch-free tests
        run: >-
          python -m pytest
          --ignore=tests/test_state.py
          --ignore=tests/test_worker_helpers.py

  integration:
    name: integration / ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install project and pinned CPU runtime
        run: |
          python -m pip install -e ".[dev,runtime]"
          python -m pip install torch==2.11.0 torchvision==0.26.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Build and install exact wheel
        run: |
          python -m build --wheel
          python -m pip uninstall -y dcp-invariant
          python -c "import glob, subprocess, sys; wheels = glob.glob('dist/*.whl'); assert len(wheels) == 1; subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--no-deps', wheels[0]])"
      - name: Verify exact wheel import boundary
        working-directory: ${{ runner.temp }}
        env:
          PYTHONNOUSERSITE: "1"
          PYTHONPATH: ""
        run: >-
          python -c "import importlib.metadata as m, os;
          from pathlib import Path;
          import dcp_invariant;
          package = Path(dcp_invariant.__file__).resolve();
          expected = Path(m.distribution('dcp-invariant').locate_file('dcp_invariant/__init__.py')).resolve();
          bootstrap = package.with_name('_torchrun_bootstrap') / 'sitecustomize.py';
          workspace = Path(os.environ['GITHUB_WORKSPACE']).resolve();
          assert package == expected;
          assert bootstrap.is_file();
          assert not package.is_relative_to(workspace);
          assert not bootstrap.resolve().is_relative_to(workspace)"
      - name: Smoke-test exact wheel worker module
        working-directory: ${{ runner.temp }}
        run: |
          python -m dcp_invariant.elastic_worker --help
          python -m dcp_invariant.async_snapshot_worker --help
          python -m dcp_invariant.lineage_worker --help
        env:
          PYTHONNOUSERSITE: "1"
          PYTHONPATH: ""
      - name: Run live thirteen-scenario suite from exact wheel
        working-directory: ${{ runner.temp }}
        run: python -m pytest --import-mode=importlib "${{ github.workspace }}/tests"
        env:
          DCP_INVARIANT_LIVE: "1"
          PYTHONNOUSERSITE: "1"
          PYTHONPATH: ""

  package:
    name: package boundary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify fetched pseudonymous Git identities
        run: python -B scripts/verify_git_identity.py .
      - name: Scan clean source tree and fetched reachable history
        run: python -B scripts/privacy_scan.py . --include-git-history
      # The owner-release gate requires a private untracked denylist and runs locally.
      - name: Build distributions
        run: |
          python -m pip install -e ".[dev]"
          python -m build
      - name: Verify source-only distribution boundary
        run: python -B scripts/verify_distribution.py dist
      - name: Install and smoke-test the wheel outside the source tree
        run: |
          python -m venv "$RUNNER_TEMP/dcp-wheel-smoke"
          "$RUNNER_TEMP/dcp-wheel-smoke/bin/python" -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          PYTHONNOUSERSITE=1 "$RUNNER_TEMP/dcp-wheel-smoke/bin/python" -c "import dcp_invariant; assert dcp_invariant.__version__ == '0.4.0'"
          PYTHONNOUSERSITE=1 "$RUNNER_TEMP/dcp-wheel-smoke/bin/python" -c "import importlib.metadata as m, os; from pathlib import Path; import dcp_invariant; package = Path(dcp_invariant.__file__).resolve(); expected = Path(m.distribution('dcp-invariant').locate_file('dcp_invariant/__init__.py')).resolve(); bootstrap = package.with_name('_torchrun_bootstrap') / 'sitecustomize.py'; workspace = Path(os.environ['GITHUB_WORKSPACE']).resolve(); assert package == expected; assert bootstrap.is_file(); assert not package.is_relative_to(workspace); assert not bootstrap.resolve().is_relative_to(workspace)"
          PYTHONNOUSERSITE=1 "$RUNNER_TEMP/dcp-wheel-smoke/bin/dcp-invariant" --help
          PYTHONNOUSERSITE=1 "$RUNNER_TEMP/dcp-wheel-smoke/bin/python" -m dcp_invariant.elastic_worker --help
          PYTHONNOUSERSITE=1 "$RUNNER_TEMP/dcp-wheel-smoke/bin/python" -m dcp_invariant.lineage_worker --help
